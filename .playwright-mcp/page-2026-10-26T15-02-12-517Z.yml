          - paragraph [ref=e12277]: Montana Technological University, popularly known as Montana Tech, is a public university in Butte, Montana. Founded in 1900 as the "Montana State School of Mines", the university became affiliated with the University of Montana in 1994. After undergoing several name changes, in 2017 the Montana University System Board of Regents voted to designate Montana Tech as part of Special Focus Four-Year Universities, the only such designation in the Montana University System. To recognize this new designation and the greater independence with it, the name was officially changed in 2018 from "Montana Tech of the University of Montana" to "Montana Technological University". Montana Tech's focus is on engineering, applied and health science.
